<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nuzlocke Tracker</title>
  <link rel="stylesheet" href="style.css?v=5" />
</head>
<body>

  <header class="titlebar">
    <div class="title-logo">
      <span class="logo-eyebrow">POKÉMON</span>
      <span class="logo-title">Nuzlocke Tracker</span>
    </div>
    <nav class="trainer-chips" id="legend"></nav>
  </header>

  <main class="screen">
    <div class="map-frame">
      <nav class="game-pills" id="gamePills"></nav>
      <div class="map-wrap" id="mapWrap">
        <img src="" alt="" id="mapImg" />
        <div class="markers" id="markers"></div>
      </div>
    </div>
  </main>

  <aside class="summary-panel" id="panel" aria-hidden="true">
    <div class="panel-handle"></div>
    <div class="summary-body" id="panelBody"></div>
    <div class="summary-footer">
      <button class="glass-btn glass-btn-primary" id="panelClose">Done</button>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <script src="app.js?v=5"></script>
</body>
</html>
