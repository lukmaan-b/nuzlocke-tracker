name: Sync saves & deploy

on:
  schedule:
    - cron: '0 8 * * *'   # daily at 08:00 UTC
  workflow_dispatch:        # allow manual trigger from GitHub UI

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # needed to push data.json back to repo

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Create saves directory
        run: mkdir -p saves

      - name: Write .env from secrets
        run: |
          echo "DROPBOX_TOKEN=${{ secrets.DROPBOX_TOKEN }}" > .env
          echo "DROPBOX_SAVE_FOLDER=${{ secrets.DROPBOX_SAVE_FOLDER }}" >> .env

      - name: Poll Dropbox & parse saves
        run: python poll_dropbox.py

      - name: Commit updated data.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site/data.json
          git diff --cached --quiet || git commit -m "chore: update save data [skip ci]"
          git push
